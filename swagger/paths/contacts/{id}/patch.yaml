tags:
  - Contacts
summary: Update contact
operationId: patchContact
description: 'Update a contact by its ID'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
    description: The ID of the contact to update
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Updated contact's name"
            example: 'Vlad Zyma'
          phoneNumber:
            type: string
            description: "Updated contact's phone number"
            example: '380999999999'
          email:
            type: string
            description: "Updated contact's email"
            example: 'asd@gmail.com'
          isFavourite:
            description: 'Favorite contact'
            type: 'boolean'
            example: true
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            description: 'Updated contact type'
            example: 'work'
          photo:
            type: string
            format: binary
            description: "Updated contact's photo"
    application/json:
      schema:
        type: object
        properties:
          phoneNumber:
            type: string
            description: "Updated contact's phone number"
            example: '380999999999'
          email:
            type: string
            description: "Updated contact's email"
            example: 'asd@gmail.com'
responses:
  '200':
    description: Update a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: '../../../components/responses/contacts/400.yaml'
  '401':
    $ref: '../../../components/responses/contacts/401.yaml'
  '404':
    $ref: '../../../components/responses/contacts/404.yaml'
  '500':
    $ref: '../../../components/responses/contacts/500.yaml'
